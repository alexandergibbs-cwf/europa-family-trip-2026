<style>
/* Modelled on iOS Calendar's day view: floating glass pills, M–Su week row (pages by week), a date line,
   an all-day row (tonight's hotel), then a 24-hour grid with tinted events. Today + Tasks float at the bottom.
   Day changes follow the finger and settle on a spring. */
:root {
  --bg: #ffffff; --ink: #000000; --sub: #6e6e73; --grid: #e5e5ea; --panel: #f2f2f7; --card: #ffffff; --hair: #d1d1d6;
  --red: #ff3b30; --blue: #007aff;
  --glass: rgba(249, 249, 251, 0.72); --glass-edge: rgba(0, 0, 0, 0.06); --glass-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
  --e-travel: #007aff; --e-travel-bg: rgba(0, 122, 255, 0.15); --e-travel-ink: #0a4fa3;
  --e-get: #8e8e93; --e-get-bg: rgba(142, 142, 147, 0.16); --e-get-ink: #48484a;
  --e-mark: #af52de; --e-mark-bg: #f3e6fa; --e-mark-ink: #6e2a91;
  --e-free: #34c759; --e-free-bg: rgba(52, 199, 89, 0.12); --e-free-ink: #1b6e34;
  --e-wait: #ff9500; --e-wait-bg: rgba(255, 149, 0, 0.14); --e-wait-ink: #8a4b00;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --spring: linear(0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%, 0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1);
  --spring-bouncy: linear(0, 0.009, 0.037 2.1%, 0.15 4.5%, 0.546 11%, 0.773 15.6%, 0.948 20.3%, 1.06 25.2%, 1.105 29%, 1.12 32.3%, 1.113 35.9%, 1.088 39.9%, 1.016 50.2%, 0.986 57.4%, 0.98 63.3%, 0.99 76.9%, 1.002 90%, 1);
  --hour: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --ink: #ffffff; --sub: #8d8d93; --grid: #2c2c2e; --panel: #1c1c1e; --card: #2c2c2e; --hair: #38383a; --red: #ff453a; --blue: #0a84ff;
  --glass: rgba(44, 44, 46, 0.68); --glass-edge: rgba(255, 255, 255, 0.10); --glass-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  --e-travel-bg: rgba(10, 132, 255, 0.28); --e-travel-ink: #8cc4ff; --e-get-bg: rgba(142, 142, 147, 0.26); --e-get-ink: #d1d1d6;
  --e-mark-bg: #3b2547; --e-mark-ink: #e0b3f5; --e-free-bg: rgba(48, 209, 88, 0.18); --e-free-ink: #7ce095; --e-wait-bg: rgba(255, 159, 10, 0.22); --e-wait-ink: #ffc069; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --ink: #ffffff; --sub: #8d8d93; --grid: #2c2c2e; --panel: #1c1c1e; --card: #2c2c2e; --hair: #38383a; --red: #ff453a; --blue: #0a84ff;
  --glass: rgba(44, 44, 46, 0.68); --glass-edge: rgba(255, 255, 255, 0.10); --glass-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  --e-travel-bg: rgba(10, 132, 255, 0.28); --e-travel-ink: #8cc4ff; --e-get-bg: rgba(142, 142, 147, 0.26); --e-get-ink: #d1d1d6;
  --e-mark-bg: #3b2547; --e-mark-ink: #e0b3f5; --e-free-bg: rgba(48, 209, 88, 0.18); --e-free-ink: #7ce095; --e-wait-bg: rgba(255, 159, 10, 0.22); --e-wait-ink: #ffc069; color-scheme: dark; }

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; overscroll-behavior-y: auto; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.35 var(--font); letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
a { color: var(--blue); text-decoration: none; }
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
::selection { background: color-mix(in srgb, var(--blue) 25%, transparent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.press { transition: transform 500ms var(--spring-bouncy); }
.press:active { transform: scale(0.95); transition: transform 90ms cubic-bezier(0.22, 1, 0.36, 1); }
.glass { background: var(--glass); backdrop-filter: saturate(1.8) blur(22px); -webkit-backdrop-filter: saturate(1.8) blur(22px); box-shadow: var(--glass-shadow), inset 0 0 0 0.5px var(--glass-edge); }

/* Header (sticky) */
.top { position: fixed; left: 0; right: 0; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.top > * { max-width: 520px; margin-left: auto; margin-right: auto; }
.pager { overflow: clip; }
.pills { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; padding-block: 10px 6px; }
.pill.ib { width: 44px; padding: 0; justify-content: center; }
.pill.title { justify-self: center; padding: 0 12px 0 16px; max-width: 100%; }
.pill.title .nm { font-weight: 600; }
.chr { width: 9px; height: 9px; border-right: 2.2px solid var(--sub); border-top: 2.2px solid var(--sub); transform: rotate(45deg); margin-left: 2px; flex: none; border-radius: 1px; }
.pills #cityPill { margin-right: auto; }
.week { border-bottom: 0.5px solid var(--hair); }
.pill { height: 44px; border: 0; border-radius: 22px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px 0 12px; font-size: 18px; font-weight: 500; cursor: pointer; color: var(--ink); min-width: 0; }
.pill .ch { width: 11px; height: 11px; border-left: 2.6px solid currentColor; border-bottom: 2.6px solid currentColor; transform: rotate(45deg); margin: 0 4px 0 6px; flex: none; border-radius: 1px; }
.pill .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
.pill .nm small { font-size: 12px; font-weight: 400; color: var(--sub); letter-spacing: -0.01em; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
.pill.wx { padding: 0 16px; font-variant-numeric: tabular-nums; gap: 8px; }
.pill.wx .e { font-size: 20px; }
.week { overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 calc(100% - 56px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 calc(100% - 56px), transparent 100%); }
.wtrack { display: flex; }
.wwrap { position: relative; }
.wk { position: relative; z-index: 1; }
.wd { width: 52px; flex: none; padding: 2px 0 8px; }
.wd .l { font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: 0; margin-bottom: 1px; }
.wd .n { width: 44px; height: 44px; transition: none; backface-visibility: hidden; }
.wd.on .n { font-weight: 600; }
/* the slot: a fixed picker-style highlight the dates pass through */
.wsel { position: absolute; left: 50%; width: 46px; height: 46px; margin-left: -23px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 9%, transparent); z-index: 0; pointer-events: none; transition: background-color 160ms ease; }
.wsel { transition: background-color 160ms ease, width 420ms cubic-bezier(0.16, 1, 0.3, 1); }
.wsel.span2 { width: 98px; border-radius: 23px; }
.wsel.today { background: color-mix(in srgb, var(--red) 16%, transparent); }
.wd.on .n { font-weight: 700; }
.wd.today.on .n { color: var(--red); }
.wwrap { position: relative; }
.wtrack { position: relative; }
.wd.today.on .l { color: var(--red); }
.wpage { flex: none; width: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 max(8px, env(safe-area-inset-left, 0px)); }
.wl { text-align: center; font-size: 13px; font-weight: 600; color: var(--ink); padding: 4px 0 6px; letter-spacing: 0; }
.wl.we { color: var(--sub); }
.wd { border: 0; background: none; padding: 0 0 8px; display: grid; justify-items: center; cursor: pointer; }
.wd .n { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 400; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; transition: background-color 200ms ease, color 200ms ease; }
.wd.we .n { color: var(--sub); }
.wd.today .n { color: var(--red); font-weight: 600; }
.wd.out { pointer-events: none; } .wd.out .n { color: var(--hair); }
.wd.pop .n { animation: pop 460ms var(--spring-bouncy); }
